[project]
name = "postgres-mcp-server"
version = "0.1.0"
description = "MCP server for interacting with PostgreSQL databases"
readme = "README.md"
requires-python = ">=3.11"
# Not for PyPI: the classifier makes PyPI refuse an accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[project.scripts]
postgres-mcp-server = "postgres_mcp.server:main"
postgres-mcp-ask = "postgres_mcp.cli:main"
postgres-mcp-descriptions-init = "postgres_mcp.init_descriptions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgres_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "image: builds and runs the Docker image (slow; enable with --run-image)",
]

[tool.coverage.run]
source = ["postgres_mcp"]
branch = true
# Also measure the CLI and server started as subprocesses by the tests.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
